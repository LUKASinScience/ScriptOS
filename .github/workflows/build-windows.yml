name: Build Windows app

# PyInstaller doesn't cross-compile, so a Windows .exe can only be produced by
# actually running on Windows — this workflow does that on GitHub's own
# Windows runner, since none of us has a Windows machine handy.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . PySide6 cryptography psutil pyinstaller

      - name: Build
        run: pyinstaller --windowed --name ScriptOS --icon app_icon.ico --noconfirm app/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ScriptOS-windows
          path: dist/ScriptOS/
